---
name: Container

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  PYTHON_VERSION: "3.14"
  # Fork of SearXNG -> publish image under "stifild/yase" (and GHCR of this repo)
  CONTAINER_IMAGE_NAME: "yase"

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64

    outputs:
      docker_tag: ${{ steps.build.outputs.docker_tag }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26"
          check-latest: "true"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: "${{ github.event.workflow_run.head_sha || github.sha }}"
          persist-credentials: "false"
          fetch-depth: "0"

      - name: Setup cache Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: "python-${{ env.PYTHON_VERSION }}-${{ runner.arch }}-${{ hashFiles('./requirements*.txt') }}"
          restore-keys: |
            python-${{ env.PYTHON_VERSION }}-${{ runner.arch }}-
          path: "./local/"

      - name: Setup cache Node.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: "nodejs-${{ runner.arch }}-${{ hashFiles('**/package-lock.json') }}"
          restore-keys: |
            nodejs-${{ runner.arch }}-
          path: "./client/simple/node_modules/"

      - name: Setup cache container
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: "container-${{ matrix.arch }}-${{ hashFiles('./requirements*.txt') }}"
          restore-keys: |
            container-${{ matrix.arch }}-
          path: "/var/tmp/buildah-cache-*/*"

      - name: Install dependencies
        run: make V=1 install

      - name: Build theme (rebrand)
        run: make themes.all

      - name: Build
        id: build
        env:
          OVERRIDE_ARCH: "${{ matrix.arch }}"
        run: make container.build

      - name: Upload container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: container-image-${{ matrix.arch }}
          path: "/var/tmp/searxng-podman/*.tar"
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64

    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: "${{ github.event.workflow_run.head_sha || github.sha }}"
          persist-credentials: "false"

      - name: Download container image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: container-image-${{ matrix.arch }}
          path: "/var/tmp/searxng-podman"
          merge-multiple: true

      - name: Test
        env:
          OVERRIDE_ARCH: "${{ matrix.arch }}"
        run: make container.test

  release:
    if: github.ref_name == 'master' || startsWith(github.ref_name, 'v')
    name: Release
    runs-on: ubuntu-26.04-arm
    needs:
      - build
      - test

    permissions:
      packages: write

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: "docker.io"
          username: "${{ secrets.DOCKER_USER }}"
          password: "${{ secrets.DOCKER_TOKEN }}"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: "ghcr.io"
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: "${{ github.event.workflow_run.head_sha || github.sha }}"
          persist-credentials: "false"

      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: container-image-*
          path: "/var/tmp/searxng-podman"
          merge-multiple: true

      - name: Release
        env:
          DOCKER_TAG: "${{ needs.build.outputs.docker_tag }}"
        run: make container.push

  deploy:
    if: github.ref_name == 'master'
    name: Deploy to production
    runs-on: ubuntu-26.04
    needs:
      - release
    environment: production

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: "${{ secrets.PROD_HOST }}"
          username: "${{ secrets.PROD_USER }}"
          key: "${{ secrets.PROD_SSH_KEY }}"
          port: "${{ secrets.PROD_PORT }}"
          script: |
            cd ~/yase/
            docker compose pull core
            docker compose up -d --force-recreate core
